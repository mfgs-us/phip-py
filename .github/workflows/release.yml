name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # for creating the GitHub Release
  id-token: write   # for PyPI trusted publishing (OIDC)

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,sys; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          echo "Tag version:     $TAG"
          echo "Package version: $PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $PKG"; exit 1; }

      - name: Build
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phip
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted publishing via OIDC — no API token needed once the
          # project is registered as a PyPI trusted publisher for this
          # repo + workflow. See RELEASING.md for one-time setup.
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Extract the section between "## [TAG]" and the next "## ["
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]"  { capture=1; next }
            capture && /^## \[/        { exit }
            capture                    { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $GITHUB_REF_NAME" > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
